{% include base_path %}

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__identity" href="{{ base_path }}/">
      <span class="site-header__name">{{ site.title }}</span>
      {% if site.author.bio %}<span class="site-header__role">{{ site.author.bio }}</span>{% endif %}
    </a>
    <nav class="site-header__nav" aria-label="Primary navigation">
      <a href="{{ base_path }}/">Home</a>
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}{% assign domain = '' %}{% else %}{% assign domain = base_path %}{% endif %}
        <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
