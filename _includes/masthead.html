{% include base_path %}

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__identity" href="{{ base_path }}/">
      <span class="site-header__name">{{ site.title }}</span>
      {% if site.author.short_bio %}<span class="site-header__role">{{ site.author.short_bio }}</span>{% endif %}
    </a>
    <nav class="site-header__nav" aria-label="Primary navigation">
      <a class="{% if page.url == '/' %}is-active{% endif %}" href="{{ base_path }}/">Home</a>
      <a href="{% if page.url == '/' %}#news{% else %}{{ base_path }}/#news{% endif %}">News</a>
      <a class="{% if page.url contains '/publications' %}is-active{% endif %}" href="{{ base_path }}/publications/">Publications</a>
      <a class="{% if page.url contains '/service' %}is-active{% endif %}" href="{{ base_path }}/service/">Service</a>
    </nav>
  </div>
</header>
