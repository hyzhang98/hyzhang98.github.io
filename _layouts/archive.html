---
layout: default
---

<main class="profile-page archive-page" id="main" role="main">
  <aside class="profile-page__profile">
    {% include author-profile.html %}
  </aside>
  <article class="profile-page__content archive" itemscope itemtype="http://schema.org/CollectionPage">
    {% if page.title %}<h1 class="archive-page__title">{{ page.title }}</h1>{% endif %}
    <section class="content-body" itemprop="text">{{ content }}</section>
  </article>
</main>
