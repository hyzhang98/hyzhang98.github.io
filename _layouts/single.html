---
layout: default
---

{% include base_path %}

<main class="profile-page" id="main" role="main">
  <aside class="profile-page__profile">
    {% include author-profile.html %}
  </aside>

  <article class="profile-page__content" itemscope itemtype="http://schema.org/CreativeWork">
    {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
    <section class="content-body" itemprop="text">
      {{ content }}
      {% if page.citation %}<p class="publication-citation">{{ page.citation }}</p>{% endif %}
      {% if page.url == "/" %}{% include home-sections.html %}{% endif %}
    </section>
  </article>
</main>
